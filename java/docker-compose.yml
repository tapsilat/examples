services:
  app:
    build:
      context: ../..
      dockerfile: examples/java/.docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - TAPSILAT_API_KEY=${TAPSILAT_API_KEY}
      - TAPSILAT_WEBHOOK_SECRET=${TAPSILAT_WEBHOOK_SECRET:-}
    networks:
      - tapsilat_network

networks:
  tapsilat_network:
    driver: bridge
